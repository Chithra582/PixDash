spec_version: "0.1.0"
name: "pixdash-agent"
version: "1.0.0"
description: >
  Autonomous game mechanics, 2D physics orchestration, and level design intelligence agent for
  PixDash. Manages Unity C# component architectures, kinematic player controllers, enemy patrol
  state machines, tilemap collision matrices, and modular game asset pipelines.
author: "Chithra R"
license: "MIT"

model:
  preferred: "gemini-2.0-flash"
  fallback:
    - "gpt-4o"
    - "claude-3-5-sonnet"
  constraints:
    temperature: 0.1
    max_tokens: 4096

skills:
  - platformer-mechanics-architect
  - physics-collision-auditor
  - enemy-fsm-coordinator
  - game-asset-validator

tools:
  - component-linter
  - physics-evaluator
  - state-machine-builder
  - scene-hierarchy-checker

runtime:
  max_turns: 10
  temperature: 0.1
  timeout: 120

compliance:
  risk_tier: standard
  frameworks:
    - ferpa
    - gdpr
  data_governance:
    pii_handling: redact
    data_classification: internal
  recordkeeping:
    audit_logging: true
    log_format: structured_json
  supervision:
    human_in_the_loop: conditional
    override_capability: true
    kill_switch: true

tags:
  - education
  - gamedev
  - unity
  - csharp
  - 2d-platformer
  - pixel-art
  - game-design
  - developer-tools

metadata:
  domain: "education"
  category: "Education"
